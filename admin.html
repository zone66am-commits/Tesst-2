<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TREMAL X — لوحة الإدارة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071514;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#039087;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #0006}
h1{margin:0;font-size:22px}header small{opacity:.85}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#0d211f;border:1px solid #17423e;border-radius:16px;padding:15px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
input,select,button{width:100%;border:0;border-radius:10px;padding:12px;font-size:15px}
input,select{background:#132c29;color:#fff;border:1px solid #24534f}
button{background:#039087;color:#fff;font-weight:bold;cursor:pointer}
button.alt{background:#173532}.danger{background:#a52d35!important}.green{background:#157d57!important}
#file{display:none}.channel{padding:12px;background:#102522;border-radius:12px;margin-top:8px;border:1px solid #1b4541}
.channel b{display:block;margin-bottom:5px}.muted{color:#9eb4b1;font-size:12px;word-break:break-all}
.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1}
#status{font-size:13px;color:#b9d8d4;margin-top:8px;line-height:1.7}
.search{margin-bottom:10px}.count{font-size:13px;color:#9eb4b1}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}.modalbox{width:min(600px,100%);max-height:92vh;overflow:auto;background:#0d211f;border:1px solid #24534f;border-radius:18px;padding:16px}
.modalbox h2{margin-top:0}.field{margin-bottom:10px}.field label{display:block;margin-bottom:6px;font-size:13px;color:#b9d8d4}
.notice{background:#102d2a;border-right:4px solid #039087;padding:11px;border-radius:9px;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>⚙️ TREMAL X — لوحة الإدارة</h1>
    <small>إدارة القنوات بدون Firebase أو ملفات إضافية</small>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="notice">
      ارفع ملف <b>index.html</b> الحالي. اللوحة تقرأ القنوات الموجودة بداخله، وبعد التعديل تضغط
      <b>تحميل index.html المعدل</b> ثم تستبدل الملف القديم في GitHub.
    </div>
    <br>
    <input id="file" type="file" accept=".html,text/html">
    <div class="row">
      <button onclick="document.getElementById('file').click()">📂 اختيار index.html</button>
      <button class="alt" onclick="resetAll()">↩️ إعادة فتح الملف</button>
    </div>
    <div id="status">لم يتم اختيار ملف بعد.</div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="row">
        <button onclick="addChannel()">＋ إضافة قناة</button>
        <button class="green" onclick="downloadIndex()">⬇️ تحميل index.html المعدل</button>
      </div>
      <br>
      <input class="search" id="search" placeholder="🔎 بحث باسم القناة أو الرابط..." oninput="render()">
      <div class="count" id="count"></div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2 id="modalTitle">إضافة قناة</h2>
    <div class="field"><label>اسم القناة</label><input id="name"></div>
    <div class="field"><label>رابط البث</label><input id="url" placeholder="https://...m3u8"></div>
    <div class="row">
      <button onclick="saveChannel()">💾 حفظ</button>
      <button class="alt" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
let originalHTML = "";
let channels = [];
let editing = -1;

const fileInput = document.getElementById("file");
fileInput.addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  originalHTML = await f.text();
  try {
    channels = extractChannels(originalHTML);
    document.getElementById("panel").style.display = "block";
    document.getElementById("status").innerHTML =
      "✅ تم تحميل <b>" + escapeHtml(f.name) + "</b> — تم العثور على <b>" + channels.length + "</b> قناة.";
    render();
  } catch(err) {
    document.getElementById("status").innerHTML =
      "❌ ما گدرت أقرأ CHANNELS من الملف. تأكد أنه ملف TREMAL X الأصلي.";
    console.error(err);
  }
});

function extractChannels(html){
  const marker = "const CHANNELS";
  const start = html.indexOf(marker);
  if(start < 0) throw new Error("CHANNELS not found");
  const eq = html.indexOf("=", start);
  const open = html.indexOf("[", eq);
  if(open < 0) throw new Error("array not found");
  const end = findMatching(html, open, "[", "]");
  const code = html.slice(open, end + 1);
  let arr = Function('"use strict"; return (' + code + ')')();
  if(!Array.isArray(arr)) throw new Error("not array");
  return arr.map(x => ({name:String(x.name ?? ""), url:String(x.url ?? "")}));
}

function findMatching(s, pos, a, b){
  let depth=0, quote=null, esc=false;
  for(let i=pos;i<s.length;i++){
    const c=s[i];
    if(quote){
      if(esc){esc=false;continue}
      if(c==="\\"){esc=true;continue}
      if(c===quote) quote=null;
      continue;
    }
    if(c==="'"||c==='"'||c==="`"){quote=c;continue}
    if(c===a) depth++;
    else if(c===b){depth--;if(depth===0)return i}
  }
  return -1;
}

function render(){
  const q=(document.getElementById("search").value||"").toLowerCase().trim();
  const filtered=channels.map((x,i)=>({x,i})).filter(o =>
    !q || o.x.name.toLowerCase().includes(q) || o.x.url.toLowerCase().includes(q)
  );
  document.getElementById("count").textContent =
    "المجموع: "+channels.length+" | الظاهر: "+filtered.length;
  document.getElementById("list").innerHTML = filtered.map(o => `
    <div class="channel">
      <b>${escapeHtml(o.x.name || "بدون اسم")}</b>
      <div class="muted">${escapeHtml(o.x.url)}</div>
      <div class="actions">
        <button onclick="editChannel(${o.i})">✏️ تعديل</button>
        <button class="danger" onclick="deleteChannel(${o.i})">🗑️ حذف</button>
      </div>
    </div>
  `).join("");
}

function addChannel(){
  editing=-1;
  document.getElementById("modalTitle").textContent="إضافة قناة";
  document.getElementById("name").value="";
  document.getElementById("url").value="";
  document.getElementById("modal").classList.add("show");
}
function editChannel(i){
  editing=i;
  document.getElementById("modalTitle").textContent="تعديل القناة";
  document.getElementById("name").value=channels[i].name;
  document.getElementById("url").value=channels[i].url;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function saveChannel(){
  const name=document.getElementById("name").value.trim();
  const url=document.getElementById("url").value.trim();
  if(!name || !url){alert("اكتب اسم القناة والرابط.");return}
  const item={name,url};
  if(editing<0) channels.push(item); else channels[editing]=item;
  closeModal(); render();
}
function deleteChannel(i){
  if(confirm("متأكد تريد حذف قناة «"+channels[i].name+"»؟")){
    channels.splice(i,1); render();
  }
}
function downloadIndex(){
  if(!originalHTML || !channels.length){alert("اختار index.html أولاً.");return}
  const start=originalHTML.indexOf("const CHANNELS");
  const eq=originalHTML.indexOf("=",start);
  const open=originalHTML.indexOf("[",eq);
  const end=findMatching(originalHTML,open,"[","]");
  if(end<0){alert("تعذر تحديد CHANNELS.");return}
  const replacement=JSON.stringify(channels,null,2);
  const out=originalHTML.slice(0,open)+replacement+originalHTML.slice(end+1);
  const blob=new Blob([out],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index.html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  document.getElementById("status").innerHTML =
    "✅ تم إنشاء <b>index.html</b> المعدل. ارفعه إلى GitHub واستبدل الملف القديم.";
}
function resetAll(){location.reload()}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
